<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    
    <title>14image_basic</title>
</head>
<body>
    <h2>이미지 삽입하기</h2>
    <img src="Penguins.jpg" alt="펭귄" width="300"><br>
    <img src="Nothing" alt="그림이 존재하지 않음55" width="300"><br>

    <img src="피카츄_애니판_공식_일러스트.webp" alt="피카츄" width="300"><br>
    
    <h2>음악 삽입</h2>
    <audio src="Kalimba.mp3" controls="controls"></audio>

    <h2>웹 브라우저 제략이 없도록 음악 삽입</h2>
    <audio controls="controls">
        <source src="kalimba.mp3" type="audio/mp3">
        <source src="kalimba.mp3" type="audio/mp3">
    </audio>

    <h2>동영상 삽입</h2>
    <video controls="controls" width="300">
        <source src="wildlife.mp4" type="video/mp4">
        <source src="wildlife.mebm" type="video/webm">
    </video>

    <h2>동영상 부러오는 동안 다른 이미지 보여주기</h2>
    <video controls="controls" width="300" poster="피카츄_애니판_공식_일러스트.webp">
        <source src="wildlife.mp4" type="video/mp4">
        <source src="wildlife.mebm" type="video/webm">
    </video>

</html>
